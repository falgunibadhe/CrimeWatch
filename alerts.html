<h2>📋 Crime Alerts</h2>

<table border="1" cellpadding="10" style="border-collapse: collapse; margin-top: 20px; width: 80%;">
  <tr style="background: #f2f2f2;">
    <th>Time</th>
    <th>Location</th>
    <th>Type</th>
    <th>Status</th>
  </tr>
  <tr *ngFor="let alert of alerts">
    <td>{{ alert.time }}</td>
    <td>{{ alert.location }}</td>
    <td>{{ alert.type }}</td>
    <td>{{ alert.status }}</td>
  </tr>
</table>
